services:
  - type: web
    name: party-rave-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_FILE
        value: /var/data/party-rave.json
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: party-rave-data
      mountPath: /var/data
      sizeGB: 1
